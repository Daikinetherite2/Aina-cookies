<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aina Cookies</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#000,#1a1a1a,#2b2100,#111);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
    overflow:hidden;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

.card{
    width:90%;
    max-width:700px;
    padding:50px 30px;
    text-align:center;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(12px);
    border:1px solid rgba(212,175,55,.4);
    border-radius:25px;
    box-shadow:0 0 30px rgba(212,175,55,.2);
    animation:fade 1s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    font-size:70px;
    animation:float 3s ease-in-out infinite;
}

@keyframes float{
    50%{
        transform:translateY(-10px);
    }
}

h1{
    color:#D4AF37;
    font-size:48px;
    margin:15px 0;
}

h2{
    color:white;
    font-size:24px;
    font-weight:normal;
    margin-bottom:25px;
}

.loading{
    width:100%;
    height:10px;
    background:#333;
    border-radius:50px;
    overflow:hidden;
}

.loading span{
    display:block;
    height:100%;
    width:0;
    background:#D4AF37;
    animation:loading 3s infinite;
}

@keyframes loading{
    from{
        width:0%;
    }
    to{
        width:100%;
    }
}

.status{
    display:inline-block;
    margin-top:25px;
    padding:12px 28px;
    border-radius:50px;
    background:#D4AF37;
    color:#111;
    font-weight:bold;
}

footer{
    margin-top:30px;
    color:#bbb;
    font-size:14px;
}

@media(max-width:600px){

h1{
font-size:34px;
}

h2{
font-size:18px;
}

.logo{
font-size:55px;
}

.card{
padding:35px 20px;
}

}
</style>

</head>

<body>

<div class="card">

<div class="logo">🍪</div>

<h1>Aina Cookies</h1>

<h2>Website Already in the Production Stage</h2>

<div class="loading">
<span></span>
</div>

<div class="status">
🚧 Coming Soon
</div>

<footer>

Freshly Baked with Love ❤️

<br><br>

© 2026 Aina Cookies. All Rights Reserved.

</footer>

</div>

</body>
</html>
