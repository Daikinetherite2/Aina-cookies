<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aina Cookies</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#050505,#111,#1b1b1b);
    color:white;
    position:relative;
}

/* Animated Background */
body::before{
    content:"";
    position:absolute;
    width:200%;
    height:200%;
    background:
    radial-gradient(circle,#d4af3733 1px,transparent 1px);
    background-size:45px 45px;
    animation:move 18s linear infinite;
    opacity:.45;
}

@keyframes move{
    from{transform:translate(0,0);}
    to{transform:translate(-120px,-120px);}
}

.card{
    position:relative;
    z-index:2;
    width:90%;
    max-width:700px;
    padding:50px;
    border-radius:25px;
    text-align:center;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(12px);
    border:1px solid rgba(212,175,55,.3);
    box-shadow:0 0 40px rgba(212,175,55,.18);
    animation:fadeUp 1s ease;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.logo{
    font-size:65px;
    margin-bottom:10px;
}

h1{
    font-size:42px;
    color:#D4AF37;
    margin-bottom:10px;
}

p{
    color:#d8d8d8;
    font-size:20px;
    margin-bottom:35px;
}

.badge{
    display:inline-block;
    padding:14px 30px;
    border-radius:999px;
    background:#D4AF37;
    color:#111;
    font-weight:bold;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}

footer{
    margin-top:30px;
    color:#999;
    font-size:14px;
}
</style>

</head>
<body>

<div class="card">

<div class="logo">🍪</div>

<h1>Aina Cookies</h1>

<p>Website Already in the Production Stage</p>

<div class="badge">
🚧 Coming Soon 🚧
</div>

<footer>
Freshly Baked with Love ❤️
</footer>

</div>

</body>
</html>
